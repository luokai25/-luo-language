name: Luo foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  character-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the 30-character register
        run: python tools/validate_character_register.py
      - name: Validate the glyph asset manifest
        run: python tools/validate_glyph_manifest.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
